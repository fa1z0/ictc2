<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Stylized locality map of AIMST University, Semeling, Bedong, Kedah">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdd"/>
      <stop offset="1" stop-color="#efe4c9"/>
    </linearGradient>
  </defs>

  <!-- land -->
  <rect width="960" height="420" fill="url(#land)"/>

  <!-- field patches -->
  <g fill="#e3d7b4" opacity=".8">
    <rect x="60" y="60" width="150" height="90" rx="6"/>
    <rect x="700" y="40" width="180" height="110" rx="6"/>
    <rect x="90" y="300" width="140" height="80" rx="6"/>
    <rect x="640" y="310" width="200" height="70" rx="6"/>
  </g>

  <!-- river -->
  <path d="M0 46 C 170 74, 300 26, 460 52 S 780 30, 960 66" fill="none" stroke="#a9c4cf" stroke-width="16" stroke-linecap="round"/>
  <path d="M0 46 C 170 74, 300 26, 460 52 S 780 30, 960 66" fill="none" stroke="#cfe0e7" stroke-width="8" stroke-linecap="round"/>

  <!-- minor roads -->
  <g fill="none" stroke="#d8c9a6" stroke-width="8" stroke-linecap="round">
    <path d="M60 170 L 470 250"/>
    <path d="M760 130 L 700 420"/>
    <path d="M240 420 L 300 200"/>
  </g>

  <!-- main road: Bedong - Semeling -->
  <path d="M110 400 C 300 350, 430 300, 560 244 S 830 150, 950 120" fill="none" stroke="#d8c9a6" stroke-width="20" stroke-linecap="round"/>
  <path d="M110 400 C 300 350, 430 300, 560 244 S 830 150, 950 120" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  <path d="M110 400 C 300 350, 430 300, 560 244 S 830 150, 950 120" fill="none" stroke="#e6b84a" stroke-width="3" stroke-dasharray="16 14" stroke-linecap="round"/>

  <!-- town dots + labels -->
  <g font-family="Georgia, serif" fill="#5a4a33">
    <circle cx="170" cy="378" r="7" fill="#746753"/>
    <text x="186" y="384" font-size="22">Bedong</text>
    <circle cx="852" cy="146" r="7" fill="#746753"/>
    <text x="778" y="128" font-size="22">Semeling</text>
  </g>

  <!-- AIMST marker -->
  <g transform="translate(545 232)">
    <ellipse cx="0" cy="4" rx="26" ry="8" fill="#2b2118" opacity=".2"/>
    <path d="M0 0 C -26 -34 -34 -52 -34 -68 A34 34 0 0 1 34 -68 C 34 -52 26 -34 0 0 Z" fill="#6e1a1a" stroke="#4d1010" stroke-width="3"/>
    <circle cx="0" cy="-68" r="13" fill="#e7cd8a" stroke="#c8992f" stroke-width="3"/>
    <rect x="44" y="-88" width="230" height="40" rx="8" fill="#6e1a1a"/>
    <text x="578" y="-740" transform="scale(1)" font-family="Georgia, serif" font-size="21" fill="#faf6ec" visibility="hidden">x</text>
    <text x="59" y="-61" font-family="Georgia, serif" font-size="21" fill="#faf6ec">AIMST University</text>
    <text x="59" y="-33" font-family="Georgia, serif" font-size="15" fill="#e7cd8a">Semeling, 08100 Bedong</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(900 320)" fill="#5a4a33">
    <path d="M0 -34 L10 0 L0 -8 L-10 0 Z"/>
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(60 392)" stroke="#5a4a33" fill="#5a4a33">
    <path d="M0 0 h110" stroke-width="4"/>
    <path d="M0 -7 v14 M110 -7 v14" stroke-width="4"/>
    <text x="122" y="6" font-family="Georgia, serif" font-size="17" stroke="none">1 km</text>
  </g>

  <!-- frame -->
  <rect x="1" y="1" width="958" height="418" fill="none" stroke="#c8992f" stroke-width="2" rx="6"/>
  <text x="480" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#746753" font-style="italic">Stylized map — not to scale</text>
</svg>
